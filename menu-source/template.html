<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <title>{{title}}</title><meta name="description" content="{{description}}">
 <meta name="theme-color" content="#f7f3e9"><link rel="canonical" href="{{URL}}">
 <link rel="alternate" hreflang="en" href="https://www.kurda.com/menu"><link rel="alternate" hreflang="ckb" href="https://www.kurda.com/menu/ckb/"><link rel="alternate" hreflang="ar" href="https://www.kurda.com/menu/ar/"><link rel="alternate" hreflang="x-default" href="https://www.kurda.com/menu">
 <meta property="og:type" content="website"><meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}"><meta property="og:url" content="{{URL}}"><meta property="og:image" content="https://www.kurda.com/menu/assets/menu-social.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
 <link rel="icon" href="/menu/assets/favicon.svg" type="image/svg+xml">
 <link rel="preload" href="/assets/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
 <link rel="stylesheet" href="/menu/menu.css?v=5"><script defer src="/menu/menu.js?v=5"></script>
 <script type="application/ld+json">{{SCHEMA}}</script>
</head>
<body id="top">
 <a class="skip" href="#menu">{{skip}}</a>{{ICONS}}
 <header class="site-header wrap">
  <a class="brand" href="https://kurda.com/" aria-label="{{home}}"><img src="/assets/kurda-logo-english.png" width="800" height="342" alt="Kurda"><img class="kurdish-logo" src="/assets/kurda-logo-kurdish.png" width="360" height="460" alt="کوردا"></a>
  <nav class="languages" aria-label="{{language}}">{{LANGUAGES}}</nav>
 </header>
 <main>
  <section class="welcome wrap" aria-labelledby="welcome-title">
   <div class="welcome-heading"><div><p class="eyebrow">{{welcome}}</p><h1 id="welcome-title">{{heading}}</h1></div><img class="welcome-sun" src="/menu/assets/sun.svg" alt="" width="64" height="64"></div>
   <div class="group-cards">{{GROUP_CARDS}}</div>
  </section>
  <div class="menu-dock" id="menu">
   <div class="wrap dock-inner">
    <nav class="group-tabs" aria-label="{{browse}}">{{GROUP_TABS}}</nav>
    <div class="search-row js-only"><form role="search" id="search-form"><label class="sr-only" for="search">{{search}}</label><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="{{search}}" enterkeyhint="search" autocomplete="off"><button type="button" id="clear-search" aria-label="{{clear}}" hidden>×</button></form><button id="picks" class="picks" type="button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg><span>{{saved}}</span><b id="picks-count">0</b></button></div>
   </div>
  </div>
  <div class="wrap menu-body">
   <nav class="category-gallery" aria-label="{{browse}}">{{CATEGORIES}}</nav>
   <div class="menu-meta"><p id="result-count" role="status" aria-live="polite">{{TOTAL}} {{items}}</p><p class="currency-note">{{prices}}</p></div>
   <div class="filter-row js-only"><label><span class="sr-only">{{browse}}</span><select id="category-select">{{CATEGORY_OPTIONS}}</select></label><label><span class="sr-only">{{sort}}</span><select id="sort"><option value="menu">{{menuOrder}}</option><option value="low">{{low}}</option><option value="high">{{high}}</option><option value="az">{{az}}</option></select></label></div>
   <p id="picks-note" hidden>{{pickNote}}</p>
   <div id="menu-sections">{{MENU}}</div>
   <div id="empty" class="empty" hidden><span aria-hidden="true">♡</span><h2>{{empty}}</h2><p>{{emptyHint}}</p><button id="reset" type="button">{{reset}}</button></div>
   <p class="order-note">{{order}}</p>
  </div>
 </main>
 <footer class="wrap"><p>{{illustrations}}</p><div><button id="motion" class="js-only" type="button" aria-pressed="false">{{pause}}</button><a href="#top">{{back}} ↑</a></div></footer>
 <script type="application/json" id="menu-data">{{DATA}}</script>
 <script type="application/json" id="menu-ui">{{UI}}</script>
</body>
</html>
